:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - clipflow-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.run_worker"]
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - clipflow-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data: